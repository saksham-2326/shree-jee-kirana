name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Android Release APK
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log
          
          # Find the generated APK
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          echo "=== FOUND APK: $APK_FILE ==="
          
          if [ -n "$APK_FILE" ]; then
            mkdir -p $GITHUB_WORKSPACE/artifacts
            mkdir -p ../artifacts
            cp "$APK_FILE" $GITHUB_WORKSPACE/artifacts/ShreeJeeKirana.apk
            cp "$APK_FILE" ../artifacts/ShreeJeeKirana.apk
            cp "$APK_FILE" $GITHUB_WORKSPACE/ShreeJeeKirana.apk
            echo "## Android APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          else
            echo "Error: No APK file was produced by Gradle!"
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ShreeJeeKirana-Android-APK
          path: |
            artifacts/ShreeJeeKirana.apk
            mobile/artifacts/ShreeJeeKirana.apk
            ShreeJeeKirana.apk
            mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Shree Jee Kirana v1.0.0 (Android APK)"
          body: |
            ## Shree Jee Kirana - Customer Mobile App (v1.0.0)
            
            **Store Details:**
            - **Store**: Shree Jee Kirana
            - **Address**: Lal Bagh, Kothariya Road, Nathdwara, Rajasthan 313301
            - **Contact**: 9079192291
            
            ### 📱 Download & Install Instructions for Android:
            1. Click **`ShreeJeeKirana.apk`** below to download directly to your mobile phone.
            2. Open the downloaded file from your notifications or Downloads folder.
            3. Tap **Install** (if prompted, enable "Install unknown apps" for your browser).
            4. Launch **Shree Jee Kirana** and test browsing, cart, and UPI checkout!
          files: |
            artifacts/ShreeJeeKirana.apk
            mobile/artifacts/ShreeJeeKirana.apk
            ShreeJeeKirana.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Diagnostic Log to Branch
        if: failure()
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout --orphan ci-logs
          git rm -rf .
          cp mobile/gradle-build.log gradle-build.log || cp gradle-build.log . || true
          git add gradle-build.log || true
          git commit -m "build log from run ${{ github.run_id }}" || true
          git push origin ci-logs --force || true

  build-ios:
    name: Build iOS App
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Install CocoaPods
        run: |
          cd ios
          pod install || true

      - name: Pre-bundle iOS Assets
        run: |
          npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output ios/main.jsbundle --assets-dest ios/

      - name: Build iOS App
        run: |
          cd ios
          xcodebuild -workspace ShreeJeeKirana.xcworkspace -scheme ShreeJeeKirana -configuration Release -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO || \
          xcodebuild -project ShreeJeeKirana.xcodeproj -scheme ShreeJeeKirana -configuration Release -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO || true

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShreeJeeKirana-iOS-Simulator
          path: mobile/ios/
          if-no-files-found: warn
